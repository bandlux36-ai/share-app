name: share_app
description: شاشة تسجيل الدخول التجريبية لتطبيق شير.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  http: ^1.6.0
  font_awesome_flutter: ^11.0.0
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/share-logo.png
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf

